<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marcas · Élite Time</title>
<meta name="description" content="Invicta, Technomarine, Curren y Poedagar originales en Élite Time, Barranquilla.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="img/marca/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://elite-time-panel.pages.dev" crossorigin>
<link rel="stylesheet" href="assets/css/elite.css">
<style>
.bnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.stack{display:grid;gap:clamp(18px,3vw,28px);padding-bottom:clamp(70px,9vw,130px)}
.bpanel{position:sticky;top:calc(var(--head-h) + 24px);min-height:min(78vh,720px);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;isolation:isolate;background:var(--ink-2);box-shadow:0 -30px 60px -30px rgba(0,0,0,.8);transform-origin:top center}
/* todas las tarjetas en blanco */
.bpanel{background:#fff;box-shadow:0 -24px 50px -30px rgba(0,0,0,.35),0 1px 0 var(--line)}
@media (max-width:900px){.bpanel{grid-template-columns:1fr;position:relative;top:0;min-height:0}}
.bpanel .txt{padding:clamp(26px,4.5vw,64px);display:flex;flex-direction:column;gap:20px;position:relative;z-index:2}
.bpanel .idx{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.2em;color:var(--dim)}
.bpanel .lg{height:clamp(56px,7vw,86px);display:flex;align-items:center}
.bpanel .lg img{max-height:100%;width:auto}
.bpanel .wd{font-family:var(--f-display);font-size:clamp(2rem,4vw,3.4rem);letter-spacing:.12em}
.bpanel h2{font-size:clamp(1.5rem,2.5vw,2.3rem);line-height:1.15}
.bpanel .lines{display:flex;flex-wrap:wrap;gap:8px}
.bpanel .lines a{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:.4em .9em;text-decoration:none;color:var(--mute);transition:.3s}
.bpanel .lines a:hover{border-color:var(--gold);color:var(--gold)}
.bpanel .meta{display:flex;gap:30px;margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.bpanel .meta b{display:block;font-family:var(--f-display);font-weight:500;font-size:2.2rem;line-height:1}
.bpanel .meta span{font-size:.8rem;color:var(--mute)}
.bpanel .vis{position:relative;display:grid;place-items:center;min-height:clamp(320px,40vw,560px);background:radial-gradient(60% 60% at 50% 50%,rgba(202,174,118,.16),transparent 70%)}
.bpanel .vis .bg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(6rem,16vw,15rem);color:transparent;-webkit-text-stroke:1px var(--line);line-height:.8;writing-mode:vertical-rl;transform:rotate(180deg);pointer-events:none;justify-self:end;padding-right:10px}
.fan{position:relative;width:min(80%,440px);aspect-ratio:1}
.fan a{position:absolute;inset:0;margin:auto;width:52%;height:82%;transition:transform 1s var(--ease)}
.fan img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 22px rgba(0,0,0,.28))}
.fan a:nth-child(1){transform:translate(-46%,6%) rotate(-16deg) scale(.82)}
.fan a:nth-child(2){transform:translate(46%,6%) rotate(16deg) scale(.82)}
.fan a:nth-child(3){transform:translate(0,-4%);z-index:2}
.bpanel:hover .fan a:nth-child(1){transform:translate(-60%,4%) rotate(-22deg) scale(.86)}
.bpanel:hover .fan a:nth-child(2){transform:translate(60%,4%) rotate(22deg) scale(.86)}
.bpanel:hover .fan a:nth-child(3){transform:translate(0,-8%) scale(1.05)}
.fan .solo{width:70%;transform:none!important}
.curren-box{width:min(86%,460px);filter:drop-shadow(0 24px 30px rgba(0,0,0,.25))}
</style>
</head>
<body>
<main>
  <section class="page-hero bg-rosette">
    <div class="bgword" aria-hidden="true" data-parallax=".15">Marcas</div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta" data-reveal><a href="index.html">Inicio</a><span>Marcas</span></nav>
      <h1 class="h-xl" data-split>Cuatro casas, <em class="gold">un estándar.</em></h1>
      <p class="lead" data-reveal=".2">Trabajamos solo relojería original. Conoce cada marca, sus líneas y los modelos que tenemos disponibles hoy.</p>
      <div class="bnav" id="bnav" data-stagger></div>
    </div>
  </section>
  <section class="light" style="padding-top:clamp(40px,6vw,80px)"><div class="wrap stack" id="stack"></div></section>
</main>

<script src="assets/js/vendor/gsap-3.12.5.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger-3.12.5.min.js"></script>
<script src="assets/js/vendor/lenis-1.1.13.min.js"></script>
<script src="assets/js/elite.js"></script>
<script>
Elite.ready(d => {
  const {$, $$, esc, fmt, BRANDS, ICON} = Elite, P = d.productos;
  const B = Object.entries(BRANDS);
  $('#bnav').innerHTML = B.map(([b, i]) => `<a class="chip" href="#${i.slug}">${b}</a>`).join('');
  $('#stack').innerHTML = B.map(([b, i], k) => {
    const L = P.filter(p => p.marca === b), pr = L.filter(p => p.precio).map(p => p.precio);
    /* los juegos de pareja traen dos relojes en la foto y en el abanico se ven amontonados */
    const pick = [...L.filter(p => p.destacado), ...L].filter((v, j, a) => a.indexOf(v) === j && !/pareja/i.test(v.modelo)).slice(0, 3);
    /* Curren muestra su caja solo mientras no haya relojes en el catálogo */
    const vis = b === 'Curren' && !L.length ? `<img class="curren-box" src="img/marca/caja-curren.webp" alt="Caja original Curren">`
      : `<div class="fan">${pick.map(p => `<a href="${Elite.url(p)}" data-cursor="Ver">${Elite.img(p.imagen, p.marca + ' ' + p.modelo, '240px', 'loading="lazy"')}</a>`).join('')}</div>`;
    return `<article class="bpanel" id="${i.slug}">
      <div class="txt">
        <span class="idx">0${k + 1} / 0${B.length} · ${esc(i.since)}</span>
        <div class="lg">${i.logo ? `<img src="${i.logo.replace('-blanco', '')}" alt="${b}">` : `<span class="wd">${i.word}</span>`}</div>
        <h2 data-split>${esc(i.line)}</h2>
        <div class="lines">${i.lines.map(l => /^Pídelo/.test(l) ? `<a href="${Elite.wa('Hola Élite Time, quiero información sobre relojes ' + b + '.')}" target="_blank" rel="noopener">${esc(l)}</a>` : `<a href="coleccion.html#${b === 'Poedagar' ? i.slug : L.length ? l.toLowerCase().replace(/\s+/g, '-') : ''}">${esc(l)}</a>`).join('')}</div>
        <div class="meta">
          <div><b>${L.length || '—'}</b><span>${L.length ? 'referencias' : 'por pedido'}</span></div>
          ${pr.length ? `<div><b class="mono" style="font-size:1.4rem;padding-top:.5rem">${fmt(Math.min(...pr))}</b><span>desde</span></div>` : ''}
        </div>
        <div>${L.length ? `<a class="btn" href="coleccion.html#${i.slug}" data-magnetic>Ver ${b} ${ICON.arrow}</a>` : `<a class="btn" href="${Elite.wa('Hola Élite Time, quiero información sobre relojes ' + b + '.')}" target="_blank" rel="noopener">${ICON.wa}Pedir ${b} por WhatsApp</a>`}</div>
      </div>
      <div class="vis"><div class="bg" aria-hidden="true">${esc(b.toUpperCase())}</div>${vis}</div>
    </article>`;
  }).join('');
  /* efecto de cartas apiladas: la anterior se encoge al llegar la siguiente */
  if (window.gsap && window.ScrollTrigger && !Elite.reduce && innerWidth > 900) {
    const cards = $$('.bpanel');
    cards.forEach((c, i) => { if (i === cards.length - 1) return; gsap.fromTo(c, { scale: 1, filter: 'brightness(1)' }, { scale: .92, filter: 'brightness(.8)', ease: 'none', scrollTrigger: { trigger: cards[i + 1], start: 'top bottom', end: 'top top+=120', scrub: true } }) });
    $$('.fan').forEach(f => gsap.from(f.children, { y: 120, opacity: 0, rotate: 0, stagger: .1, duration: 1.2, ease: 'expo.out', scrollTrigger: { trigger: f, start: 'top 80%' } }));
  }
  if (location.hash) setTimeout(() => { const t = $(location.hash); t && (Elite.lenis ? Elite.lenis.scrollTo(t, { offset: -100, immediate: true }) : t.scrollIntoView()) }, 300);
});
</script>
</body>
</html>
