<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colección · Élite Time</title>
<meta name="description" content="Catálogo completo de relojes originales Invicta, Technomarine, Curren y Poedagar en Élite Time, Barranquilla.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="img/marca/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://elite-time-panel.pages.dev" crossorigin>
<link rel="stylesheet" href="assets/css/elite.css">
<style>
.ch-top{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end}
@media (max-width:800px){.ch-top{grid-template-columns:1fr}}
.bigcount{font-family:var(--f-display);font-size:clamp(5rem,14vw,12rem);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--gold-2);font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:clamp(28px,4vw,48px)}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:16px;text-align:left;cursor:pointer;display:grid;gap:4px;overflow:hidden;transition:border-color .4s,transform .5s var(--ease)}
.cat:hover{border-color:var(--gold-2);transform:translateY(-3px)}
.cat[data-cat="nuevo"]{border-color:var(--gold-2)}
.cat[data-cat="nuevo"] small{color:var(--gold)}
.cat small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.cat b{font-family:var(--f-display);font-weight:500;font-size:1.3rem}
.cat span{font-size:.8rem;color:var(--mute)}
.cat img{position:absolute;right:-10px;bottom:-14px;width:72px;opacity:.5;transition:transform .7s var(--ease),opacity .4s;filter:drop-shadow(0 10px 10px #000)}
.cat:hover img{transform:rotate(-12deg) scale(1.1);opacity:.9}
.cat[aria-pressed="true"]{background:var(--bone);border-color:var(--bone);color:var(--ink)}
.cat[aria-pressed="true"] small,.cat[aria-pressed="true"] span{color:var(--ink-4)}
.cat[aria-pressed="true"] img{opacity:1}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h));z-index:30;background:rgba(10,10,10,.9);backdrop-filter:blur(14px);border-block:1px solid var(--line);margin-bottom:28px;transition:top .5s var(--ease)}
.site-head.hide ~ main .bar{top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;gap:12px;align-items:center;padding-block:12px;flex-wrap:wrap}
.lines{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 320px;min-width:0;mask-image:linear-gradient(90deg,#000 90%,transparent)}
.srch{position:relative;flex:0 1 260px;min-width:180px}
.srch input{padding-left:2.6em;border-radius:999px}
.srch svg{position:absolute;left:1em;top:50%;transform:translateY(-50%);width:16px;color:var(--mute)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl select{border-radius:999px;width:auto}
.range{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--mute)}
.range input{accent-color:var(--gold);width:130px}
.range b{font-family:var(--f-mono);font-weight:400;color:var(--bone);min-width:84px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;color:var(--mute);font-size:.9rem;flex-wrap:wrap}
.status button{background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.more{display:flex;justify-content:center;margin-top:44px}
.empty{padding:80px 0;text-align:center;display:grid;gap:16px;justify-items:center;color:var(--mute)}
@media (max-width:700px){.bar{position:static}.bar-in{gap:8px}.srch{flex:1 1 100%}.range input{width:100px}}
</style>
</head>
<body>
<main>
  <section class="page-hero bg-tex">
    <div class="bgword" aria-hidden="true" data-parallax=".15">Colección</div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Ruta" data-reveal><a href="index.html">Inicio</a><span>Colección</span></nav>
      <div class="ch-top">
        <div><h1 class="h-xl" data-split>La <em class="gold">colección.</em></h1><p class="lead" data-reveal=".2">Relojes originales con garantía de 1 año. Filtra por marca, línea o precio y pídelo por WhatsApp o desde el carrito.</p></div>
        <div class="bigcount mono" id="big" data-reveal=".1">80</div>
      </div>
      <div class="cats" id="cats" data-stagger></div>
    </div>
  </section>

  <div class="bar"><div class="wrap bar-in">
    <div class="lines" id="lines" role="group" aria-label="Línea"></div>
    <label class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="input" id="q" type="search" placeholder="Modelo o referencia" aria-label="Buscar"></label>
    <div class="ctrl">
      <label class="range"><span>Hasta</span><input type="range" id="max" min="100000" max="650000" step="10000" value="650000" aria-label="Precio máximo"><b id="maxL">$650.000</b></label>
      <select class="input" id="sort" aria-label="Ordenar"><option value="dest">Destacados</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="az">A–Z</option></select>
    </div>
  </div></div>

  <section class="light" style="padding-block:28px clamp(70px,9vw,130px)"><div class="wrap">
    <div class="status"><span id="st" aria-live="polite"></span><button id="clear" hidden>Quitar filtros</button></div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn ghost" id="more">Ver más relojes</button></div>
  </div></section>
</main>

<script src="assets/js/vendor/gsap-3.12.5.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger-3.12.5.min.js"></script>
<script src="assets/js/vendor/lenis-1.1.13.min.js"></script>
<script src="assets/js/elite.js"></script>
<script>
Elite.ready(d => {
  const {$, $$, esc, fmt, BRANDS} = Elite, P = d.productos;
  const S = {cat: 'todas', line: '', q: '', max: 650000, sort: 'dest', limit: 16};
  const maxPrice = Math.max(...P.map(p => p.precio || 0), 100000);
  $('#max').max = Math.ceil(maxPrice / 10000) * 10000; $('#max').value = S.max = +$('#max').max; $('#maxL').textContent = fmt(S.max);
  const imgOf = f => (P.find(f) || {}).imagen || 'img/marca/logo.webp';
  const CATS = [
    ['todas', 'Todo', 'Catálogo', () => true],
    ...(P.some(Elite.esNuevo) ? [['nuevo', 'Lo nuevo', 'Recién llegados', Elite.esNuevo]] : []),
    ['hombre', 'Hombre', 'Para él', p => p.genero === 'Hombre' || p.genero === 'Unisex'],
    ['mujer', 'Mujer', 'Para ella', p => p.genero === 'Mujer' || p.genero === 'Unisex'],
    ...Elite.brands().filter(b => b !== 'Curren' || P.some(p => p.marca === 'Curren')).map(b => [BRANDS[b]?.slug || b.toLowerCase(), b, 'Marca', p => p.marca === b])
  ];
  const catFn = () => (CATS.find(c => c[0] === S.cat) || CATS[0])[3];
  $('#cats').innerHTML = CATS.map(([k, t, sm, f]) => `<button class="cat" data-cat="${k}" aria-pressed="false"><small>${sm}</small><b>${t}</b><span>${P.filter(f).length} relojes</span>${Elite.img(imgOf(f), '', '80px', 'loading="lazy"')}</button>`).join('');
  const lineOf = p => { const m = p.modelo.replace(/\(.*?\)/g, '').trim().split(/\s+/); const w = m[0] === "Women's" ? m[1] : m[0]; return /^(Pro|Sea|Ocean|Mini)$/.test(w) ? m.slice(0, 2).join(' ').replace("Women's ", '') : w.replace(/^Fondo$/, 'Clásico') };
  function renderLines() {
    const pool = P.filter(catFn()), c = {}; pool.forEach(p => { const l = lineOf(p); c[l] = (c[l] || 0) + 1 });
    const ls = Object.entries(c).sort((a, b) => b[1] - a[1]);
    $('#lines').innerHTML = `<button class="chip" data-line="" aria-pressed="${!S.line}">Todas las líneas</button>` + ls.map(([l, n]) => `<button class="chip" data-line="${esc(l)}" aria-pressed="${S.line === l}">${esc(l)}<sup>${n}</sup></button>`).join('');
  }
  function list() {
    const q = S.q.trim().toLowerCase();
    const by = {asc: (a, b) => (a.precio || 9e9) - (b.precio || 9e9), desc: (a, b) => (b.precio || 0) - (a.precio || 0), az: (a, b) => a.modelo.localeCompare(b.modelo), dest: S.cat === 'nuevo' ? (a, b) => Elite.alta(b) - Elite.alta(a) : (a, b) => (b.destacado - a.destacado) || ((b.disponible !== false) - (a.disponible !== false))}[S.sort];
    return P.filter(catFn()).filter(p => (!S.line || lineOf(p) === S.line) && (!q || (p.marca + ' ' + p.modelo).toLowerCase().includes(q)) && (!p.precio || p.precio <= S.max)).sort(by);
  }
  function render(anim = true) {
    $$('.cat').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === S.cat));
    const l = list(), shown = l.slice(0, S.limit);
    $('#grid').innerHTML = shown.length ? shown.map(Elite.card).join('') : `<div class="empty" style="grid-column:1/-1"><p>No encontramos relojes con esos filtros. Muchas referencias llegan por pedido: escríbenos y te lo conseguimos.</p><a class="btn ghost" data-wa href="${Elite.wa('Hola Élite Time, busco un reloj que no encontré en la página: ' + (S.q || ''))}" target="_blank" rel="noopener">Preguntar por WhatsApp</a></div>`;
    $('#st').textContent = `Mostrando ${shown.length} de ${l.length} ${l.length === 1 ? 'reloj' : 'relojes'}`;
    $('#more').hidden = l.length <= S.limit;
    $('#clear').hidden = S.cat === 'todas' && !S.line && !S.q && S.max >= +$('#max').max;
    animateNum($('#big'), l.length);
    if (anim) Elite.animateCards($$('#grid .pcard'));
    const tok = S.line ? S.line.toLowerCase().replace(/\s+/g, '-') : S.cat; if (tok !== 'todas') history.replaceState(null, '', '#' + tok); else history.replaceState(null, '', location.pathname);
  }
  function animateNum(el, to) { const from = +el.textContent || 0; if (Elite.reduce || from === to) { el.textContent = to; return } const t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f) })(t0) }
  /* leer filtro de la URL: #invicta, #mujer, #racing */
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if (h) { const c = CATS.find(c => c[0] === h); if (c) S.cat = h; else { const l = [...new Set(P.map(lineOf))].find(l => l.toLowerCase().replace(/\s+/g, '-') === h); if (l) S.line = l; else if (h !== 'nuevo') S.q = h } $('#q').value = S.q }
  renderLines(); render(false);
  $('#cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; S.cat = b.dataset.cat; S.line = ''; S.limit = 16; renderLines(); render(); };
  $('#lines').onclick = e => { const b = e.target.closest('[data-line]'); if (!b) return; S.line = b.dataset.line; S.limit = 16; renderLines(); render() };
  let t; $('#q').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value; S.limit = 16; render() }, 180) };
  $('#max').oninput = e => { S.max = +e.target.value; $('#maxL').textContent = fmt(S.max); clearTimeout(t); t = setTimeout(render, 120) };
  $('#sort').onchange = e => { S.sort = e.target.value; render() };
  $('#more').onclick = () => { const n = S.limit; S.limit += 16; render(false); Elite.animateCards($$('#grid .pcard').slice(n)); window.ScrollTrigger?.refresh() };
  $('#clear').onclick = () => { Object.assign(S, {cat: 'todas', line: '', q: '', max: +$('#max').max, limit: 16}); $('#q').value = ''; $('#max').value = S.max; $('#maxL').textContent = fmt(S.max); renderLines(); render() };
  addEventListener('hashchange', () => location.reload());
});
</script>
</body>
</html>
