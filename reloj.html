<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reloj · Élite Time</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="img/marca/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://elite-time-panel.pages.dev" crossorigin>
<link rel="stylesheet" href="assets/css/elite.css">
<style>
.pd{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,80px);align-items:start;padding-block:clamp(20px,3vw,40px) clamp(60px,8vw,110px)}
@media (max-width:900px){.pd{grid-template-columns:1fr}}
.pd-media{position:sticky;top:calc(var(--head-h) + 20px);min-width:0}
@media (max-width:900px){.pd-media{position:relative;top:0}}
.pd-stage{position:relative;border-radius:var(--r-lg);border:1px solid #e6e6e6;overflow:hidden;aspect-ratio:1;display:grid;place-items:center;background:#fff;--line:#ececec;--line-2:#e2e2e2;isolation:isolate}
.pd-stage .ring{position:absolute;inset:9%;border-radius:50%;border:1px dashed var(--line-2);z-index:-1;animation:spin 60s linear infinite}
.pd-stage .ring::after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
.pd-stage img{position:absolute;inset:11%;width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 26px 28px rgba(0,0,0,.22))}
.pd-stage.photo img{inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.pd-stage.photo .ring,.pd-stage.photo .bgname{display:none}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.thumbs button{flex:none;width:76px;height:76px;padding:0;border-radius:12px;border:1px solid #e2e2e2;background:#fff;overflow:hidden;cursor:pointer;transition:border-color .3s,box-shadow .3s}
.thumbs button[aria-current=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button:first-child img{object-fit:contain;padding:8%}
@media (max-width:520px){.thumbs button{width:62px;height:62px}}
.pd-stage.zoom{cursor:zoom-in}
.pd-stage.zoom img{filter:none}
.pd-stage .bgname{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:clamp(3rem,9vw,8rem);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--line);z-index:-1;white-space:nowrap;letter-spacing:.06em}
.pd-info{display:grid;gap:22px;min-width:0}
.pd-info h1{font-size:clamp(2.4rem,5vw,4.4rem)}
.price-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.price-row .p{font-family:var(--f-mono);font-size:clamp(1.6rem,3vw,2.2rem)}
.badge{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.4em .8em;border-radius:999px;border:1px solid}
.badge.ok{color:var(--ok);border-color:rgba(143,181,154,.4)}
.badge.no{color:var(--bad);border-color:rgba(208,139,127,.4)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.specs div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:4px}
.specs div:last-child{border-right:0}
.specs small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.specs b{font-weight:500;font-size:.95rem}
@media (max-width:520px){.specs{grid-template-columns:1fr 1fr}.specs div:nth-child(2){border-right:0}.specs div:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line)}}
.opt h3{font-family:var(--f-mono);font-weight:400;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:12px;display:flex;justify-content:space-between}
.incl{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2)}
.incl svg{width:22px;height:22px;flex:none;color:var(--gold);margin-top:2px}
.incl b{display:block;font-weight:600}
.incl span{font-size:.9rem;color:var(--mute)}
.addon{display:flex;gap:14px;align-items:flex-start;padding:16px;margin-top:10px;border:1px dashed var(--line-2);border-radius:var(--r);cursor:pointer;transition:border-color .3s,background .3s}
.addon:hover{border-color:var(--gold)}
.addon input{accent-color:var(--gold);width:20px;height:20px;margin:2px 0 0;flex:none}
.addon b{display:block;font-weight:600}
.addon small{display:block;font-size:.88rem;color:var(--mute)}
.addon:has(input:checked){border-style:solid;border-color:var(--gold);background:var(--ink-3)}
.buy{display:grid;grid-template-columns:auto 1fr;gap:10px}
.qty-l{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:999px}
.qty-l button{width:44px;height:52px;border:0;background:none;cursor:pointer;font-size:1.1rem;color:var(--bone)}
.qty-l span{min-width:28px;text-align:center;font-family:var(--f-mono)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:12px;color:var(--mute)}
.list li::before{content:"";flex:none;width:7px;height:7px;margin-top:.6em;border:1px solid var(--gold);transform:rotate(45deg)}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.perks div{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;font-size:.84rem;color:var(--mute)}
.perks svg{width:22px;color:var(--gold)}
.perks b{color:var(--bone);font-weight:500;font-size:.92rem}
@media (max-width:520px){.perks{grid-template-columns:1fr}}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 0;cursor:pointer;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);font-size:1.2rem;color:var(--gold);transition:transform .4s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 18px;color:var(--mute)}
.sp{margin-bottom:18px;display:grid}
.sp h4{margin:14px 0 8px;padding:11px 16px;background:#0d0d0d;color:#fff;font-family:var(--f-body,inherit);font-weight:700;font-size:1rem;letter-spacing:.01em}
.sp h4:first-child{margin-top:0}
.sp div{padding:5px 16px;color:var(--bone);font-size:.98rem;line-height:1.5}
.sp div b{font-weight:700}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:65;background:rgba(18,18,18,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);display:none;gap:12px;align-items:center;transform:translateY(110%);transition:transform .5s var(--ease)}
.mbar.on{transform:none}
.mbar .p{font-family:var(--f-mono);font-size:1.05rem}
.mbar small{display:block;color:var(--mute);font-size:.75rem;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.mbar{display:flex}.mbar .btn{flex:1}body.has-mbar .wa-fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.rel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,23%);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none}
.rel .pcard{scroll-snap-align:start}
@media (max-width:700px){.rel{grid-auto-columns:70%}}
.nf{padding:120px 0;text-align:center;display:grid;gap:18px;justify-items:center}
</style>
</head>
<body>
<main>
  <div class="light"><div class="wrap" style="padding-top:clamp(20px,3vw,34px)"><nav class="crumbs" aria-label="Ruta" id="crumbs"><a href="index.html">Inicio</a><span><a href="coleccion.html">Colección</a></span></nav></div>
  <div class="wrap pd" id="pd"></div></div>
  <section class="sec bg-gold" id="relSec">
    <div class="wrap">
      <div class="sec-head"><div><span class="eyebrow">También te puede gustar</span><h2 class="h-md" data-split>Más de <em class="gold" id="relBrand">la marca</em></h2></div><a class="btn ghost" href="coleccion.html" id="relAll">Ver todos</a></div>
      <div class="rel" id="rel"></div>
    </div>
  </section>
  <div class="mbar" id="mbar"><div><span class="p" id="mbP"></span><small id="mbN"></small></div><button class="btn" id="mbAdd">Agregar al carrito</button></div>
</main>

<script src="assets/js/vendor/gsap-3.12.5.min.js"></script>
<script src="assets/js/vendor/ScrollTrigger-3.12.5.min.js"></script>
<script src="assets/js/vendor/lenis-1.1.13.min.js"></script>
<script src="assets/js/elite.js"></script>
<script>
Elite.ready(d => {
  const {$, $$, esc, fmt, ICON, BRANDS} = Elite;
  const p = Elite.byId(decodeURIComponent(location.hash.slice(1))) || d.productos.find(x => x.destacado) ;
  if (!p) { $('#pd').innerHTML = `<div class="nf" style="grid-column:1/-1"><h1 class="h-md">No encontramos ese reloj.</h1><a class="btn" href="coleccion.html">Volver a la colección</a></div>`; $('#relSec').hidden = true; return }
  document.title = `${p.marca} ${p.modelo} · Élite Time`;
  const sold = p.disponible === false, isInv = p.marca === 'Invicta';
  const ref = (p.modelo.match(/[A-Z]*-?\d[\w-]*/g) || []).pop() || '—';
  const line = p.modelo.replace(/\(.*?\)/g, '').replace(ref, '').trim() || p.modelo;
  /* la caja de impacto es un extra opcional y solo existe para Invicta y Technomarine */
  const impactOk = ['Invicta', 'Technomarine'].includes(p.marca);
  let impact = false, qty = 1;
  /* fotos: primero la principal (sin fondo) y luego las que se agregan en el panel */
  const pics = [p.imagen, ...(p.fotos || [])].filter(Boolean);
  /* especificaciones: todas las fichas se muestran igual, por secciones y con «Nombre : valor», aunque en el
     panel se hayan pegado en otro formato: nombre y valor en líneas separadas, sin secciones, con viñetas,
     en mayúsculas o solo tres frases sueltas */
  const specsHTML = L => {
    const kv = l => l.match(/^(.+?)\s*:\s*(.*)$/);
    const SEC = /^(especificaciones( generales| técnicas)?|características( principales)?|caja( y esfera)?|esfera|dial|tablero|movimiento|mecanismo|correa|banda|pulsera|brazalete)$/i;
    const titulo = t => t === t.toUpperCase() ? t.toLowerCase().split(' ').map((w, i) => i && /^(y|de|del|la|el|en)$/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : t;
    const limpio = t => String(t).replace(/^[\s*•·◆\-–]+/, '').replace(/\bMeterial\b/g, 'Material').replace(/\bdel la\b/g, 'de la').replace(/Corre-a/g, 'Correa').trim();
    const SUELTAS = { 'movimiento de cuarzo': ['Tipo de Movimiento', 'Cuarzo'], 'acero inoxidable': ['Material de la Caja', 'Acero inoxidable'], 'resistente al agua': ['Resistencia al Agua', 'Sí'] };
    let lineas = L.map(limpio).filter(Boolean);
    const secciones = []; let actual = null;
    const seccion = t => { actual = { t: titulo(t.replace(/:$/, '')), filas: [] }; secciones.push(actual) };
    const fila = (k, v) => { v = String(v).trim(); if (!v || v.startsWith(':')) return; if (!actual) seccion(''); actual.filas.push([k.trim(), v]) };
    if (!lineas.some(l => kv(l))) {
      // nombre y valor en líneas separadas (o frases sueltas)
      for (let i = 0; i < lineas.length; i++) {
        const l = lineas[i], suelta = SUELTAS[l.toLowerCase()];
        if (suelta) fila(...suelta);
        else if (SEC.test(l)) seccion(l);
        else if (i + 1 < lineas.length) fila(l, lineas[++i]);
      }
    } else {
      lineas.forEach((l, i) => {
        const m = kv(l), sigue = lineas[i + 1] && kv(lineas[i + 1]);
        if (m && m[2].trim() === '') { if (SEC.test(m[1])) seccion(m[1]) }
        else if (m) fila(m[1], m[2]);
        else if (SEC.test(l) || sigue) seccion(l);
        else fila('', l);
      });
    }
    // sin títulos (o con uno solo genérico): se agrupan como en las fichas completas
    const llenas = secciones.filter(s => s.filas.length);
    if (llenas.length === 1 && (!llenas[0].t || /^(especificaciones|características)/i.test(llenas[0].t))) {
      const grupo = k => /correa|pulsera|banda|hebilla|cierre|brazalete/i.test(k) ? 'Correa' : /movimiento|calibre|joyas|mecanismo/i.test(k) ? 'Movimiento' : /caja|esfera|dial|tablero|bisel|cristal|corona|diámetro|grosor|luminos|agujas|marcación/i.test(k) ? 'Caja' : 'Especificaciones Generales';
      const orden = ['Especificaciones Generales', 'Caja', 'Movimiento', 'Correa'], g = {};
      llenas[0].filas.forEach(f => (g[grupo(f[0])] ||= []).push(f));
      secciones.splice(0, secciones.length, ...orden.filter(t => g[t]).map(t => ({ t, filas: g[t] })));
    }
    const html = secciones.filter(s => s.filas.length).map(s => (s.t ? `<h4>${esc(s.t)}</h4>` : '') + s.filas.map(([k, v]) => `<div>${k ? `<b>${esc(k)} :</b> ` : ''}${esc(v)}</div>`).join('')).join('');
    return html ? `<div class="sp">${html}</div>` : `<ul class="list" style="margin-bottom:18px">${L.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  };
  $('#crumbs').insertAdjacentHTML('beforeend', `<span><a href="coleccion.html#${BRANDS[p.marca]?.slug || ''}">${esc(p.marca)}</a></span><span>${esc(p.modelo)}</span>`);
  $('#pd').innerHTML = `
  <div class="pd-media"><div class="pd-stage" id="stage" data-fly>
    <div class="ring"></div><div class="bgname" aria-hidden="true">${esc(p.marca.toUpperCase())}</div>
    ${sold ? '<span class="tag">Agotado</span>' : p.promo ? '<span class="tag hw">Halloween</span>' : p.destacado ? '<span class="tag gold">Destacado</span>' : ''}
    ${Elite.img(p.imagen, p.marca + ' ' + p.modelo, '(max-width:900px) 82vw, 560px', 'id="pimg" fetchpriority="high"')}
  </div>${pics.length > 1 ? `<div class="thumbs" id="thumbs" role="list">${pics.map((f, i) => `<button type="button" data-i="${i}" aria-current="${!i}" aria-label="Foto ${i + 1}">${Elite.img(f, '', '76px', 'loading="lazy"')}</button>`).join('')}</div>` : ''}</div>
  <div class="pd-info">
    <span class="eyebrow" data-reveal>${esc(p.marca)} · ${esc(p.genero)}</span>
    <h1 data-split>${esc(p.modelo)}</h1>
    <div class="price-row" data-reveal=".15"><span class="p">${p.antes ? `<s class="was">${fmt(p.antes)}</s>` : ''}${fmt(p.precio)}</span><span class="badge ${sold ? 'no' : 'ok'}">${sold ? 'Agotado' : 'Disponible'}</span>${p.promo ? '<span class="badge hw">Halloween · envío gratis</span>' : ''}</div>
    <div class="specs" data-reveal=".2"><div><small>Línea</small><b>${esc(line)}</b></div><div><small>Referencia</small><b class="mono">${esc(ref)}</b></div><div><small>Para</small><b>${esc(p.genero)}</b></div></div>
    <div class="opt" data-reveal=".25"><h3><span>Presentación</span></h3>
      <div class="incl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><div><b>Caja original incluida</b><span>Entregado en nuestra tula reutilizable Élite Time.</span></div></div>
      ${impactOk ? `<label class="addon"><input type="checkbox" id="impact"><span><b>Agregar caja de impacto</b><small>Opcional, con costo adicional. Te confirmamos el precio por WhatsApp.</small></span></label>` : ''}</div>
    <div class="buy" data-reveal=".3">
      <div class="qty-l"><button id="qm" aria-label="Menos">−</button><span id="qv">1</span><button id="qp" aria-label="Más">+</button></div>
      <button class="btn" id="add" ${sold ? 'disabled' : ''} data-magnetic>${ICON.bag}${sold ? 'Agotado' : 'Agregar al carrito'}</button>
    </div>
    <div data-reveal=".35"><a class="btn ghost block" id="now" href="#" target="_blank" rel="noopener">${ICON.wa}${sold ? 'Preguntar cuándo llega' : 'Comprar ahora por WhatsApp'}</a></div>
    <div class="perks" data-stagger>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><b>Garantía 1 año</b>Maquinaria y batería</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/></svg><b>Envío nacional</b>Inmediato en Barranquilla</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/></svg><b>Contra entrega</b>Barranquilla y Soledad</div>
    </div>
    <div data-reveal>
      <details open><summary>Especificaciones técnicas</summary>${specsHTML(Elite.specs(p))}</details>
      <details open><summary>Qué incluye este artículo</summary><ul class="list" style="margin-bottom:18px"><li>Reloj totalmente original</li><li>Estuche suministrado por el fabricante</li><li>Tarjeta de garantía</li></ul></details>
      <details><summary>Garantía</summary><p>Todos los artículos y relojes vendidos por Élite Time oficial están cobijados por una garantía de 12 meses (cobertura por maquinaria o defectos de batería).</p><p>No incluye golpes, rayones, bandas, cristal o el uso inadecuado del producto.</p></details>
      <details><summary>Presentación</summary><p>Cada reloj llega en su caja original, dentro de nuestra tula reutilizable Élite Time.${impactOk ? ' Para ' + esc(p.marca) + ' puedes agregar la caja de impacto, que tiene un costo adicional.' : ''}</p></details>
      <details><summary>Envío y pago</summary><p>Envíos a todo el país. Entrega inmediata en Barranquilla. Pago contra entrega en Barranquilla y Soledad, o por transferencia.</p></details>
    </div>
  </div>`;
  const msg = () => (sold ? `Hola Élite Time, ¿cuándo vuelve a estar disponible el ${p.marca} ${p.modelo}?` : `Hola Élite Time, quiero comprar ${qty} × ${p.marca} ${p.modelo}${p.precio ? ' (' + fmt(p.precio) + (p.promo ? ', promo de Halloween con envío gratis' : '') + ')' : ''} ${impact ? ' y quiero agregar la caja de impacto (costo adicional)' : ''}. ¿Está disponible?`).replace(/\s{2,}/g, ' ');
  const upd = () => { $('#qv').textContent = qty; $('#now').href = Elite.wa(msg()) };
  upd();
  if (impactOk) $('#impact').onchange = e => { impact = e.target.checked; upd() };
  $('#qm').onclick = () => { qty = Math.max(1, qty - 1); upd() }; $('#qp').onclick = () => { qty++; upd() };
  const add = e => { if (sold) return; Elite.cart.add(p.id, qty, impact ? 'de impacto' : '', $('#pimg')) };
  $('#add').onclick = add; $('#mbAdd').onclick = add;
  const im = $('#pimg');
  if (window.gsap && !Elite.reduce) gsap.from(im, { scale: .6, rotate: -20, opacity: 0, duration: 1.6, ease: 'expo.out', delay: .1 });
  /* zoom al pasar el mouse: la foto se agranda y sigue al puntero */
  const stage = $('#stage');
  if (window.gsap && matchMedia('(hover:hover) and (pointer:fine)').matches) {
    const Z = 2.2, mx = gsap.quickTo(im, 'x', { duration: .45, ease: 'power3' }), my = gsap.quickTo(im, 'y', { duration: .45, ease: 'power3' });
    const follow = e => {
      const r = stage.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
      mx(-u * im.offsetWidth * (Z - 1)); my(-v * im.offsetHeight * (Z - 1));
    };
    stage.addEventListener('pointerenter', e => {
      im.sizes = '1600px'; /* pide la foto en tamaño completo para que no se pixele */
      stage.classList.add('zoom'); gsap.to(im, { scale: Z, rotate: 0, opacity: 1, duration: .5, ease: 'power3.out', overwrite: 'auto' }); follow(e);
    });
    stage.addEventListener('pointermove', e => stage.classList.contains('zoom') && follow(e));
    stage.addEventListener('pointerleave', () => { stage.classList.remove('zoom'); gsap.to(im, { scale: 1, duration: .55, ease: 'power3.out', overwrite: 'auto' }); mx(0); my(0) });
  }
  /* galería */
  if (pics.length > 1) $('#thumbs').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; const i = +b.dataset.i;
    $$('#thumbs button').forEach(x => x.setAttribute('aria-current', x === b));
    const t = document.createElement('div'); t.innerHTML = Elite.img(pics[i], '', '(max-width:900px) 82vw, 560px'); const n = t.firstChild;
    if (n.getAttribute('srcset')) im.srcset = n.getAttribute('srcset'); else im.removeAttribute('srcset');
    im.src = n.getAttribute('src'); stage.classList.toggle('photo', i > 0);
    if (window.gsap && !stage.classList.contains('zoom')) gsap.fromTo(im, { opacity: 0 }, { opacity: 1, duration: .4 });
  };
  /* barra móvil */
  $('#mbP').textContent = fmt(p.precio); $('#mbN').textContent = p.modelo; $('#mbAdd').disabled = sold; if (sold) $('#mbAdd').textContent = 'Agotado';
  document.body.classList.add('has-mbar');
  const io = new IntersectionObserver(([en]) => $('#mbar').classList.toggle('on', !en.isIntersecting && en.boundingClientRect.top < 0)); io.observe($('#add'));
  /* relacionados */
  let R = d.productos.filter(x => x.marca === p.marca && x.id !== p.id); R = R.filter(x => x.genero === p.genero).concat(R.filter(x => x.genero !== p.genero)).slice(0, 10);
  if (R.length < 4) R = R.concat(d.productos.filter(x => x.id !== p.id && !R.includes(x)).slice(0, 8 - R.length));
  $('#rel').innerHTML = R.map(Elite.card).join(''); $('#relBrand').textContent = p.marca; $('#relAll').href = 'coleccion.html#' + (BRANDS[p.marca]?.slug || '');
  addEventListener('hashchange', () => location.reload());
});
